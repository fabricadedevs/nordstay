spring:
  application:
    name: reservation-service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${DOOR_LOCK_JWK_SET_URI:http://localhost:8082/oauth2/jwks}
  data:
    redis:
      database: 0
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:nordstay-local}
      connect-timeout: 60000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
server:
  port: 8081
reservation:
  outbox:
    enabled: true
    topic: nordstay.checkin-realizado
    poll-interval-ms: 1000
    lock-ttl-ms: 40000
    publish-timeout-ms: 25000
  checkout:
    topic: nordstay.checkout-solicitado
