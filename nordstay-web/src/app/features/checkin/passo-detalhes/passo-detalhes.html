<h2>Últimos detalhes</h2>
    <p class="apoio">Só mais três informações.</p>

    <form [formGroup]="form" (ngSubmit)="enviar()" novalidate>
      <div class="ns-card linha">
        <div>
          <strong id="rotulo-acompanhantes">Acompanhantes</strong>
          <small>Até {{ max }} pessoas</small>
        </div>
        <div class="contador" role="group" aria-labelledby="rotulo-acompanhantes">
          <button type="button" aria-label="Diminuir acompanhantes" (click)="alterar(-1)" [disabled]="acompanhantes === 0">−</button>
          <output aria-live="polite">{{ acompanhantes }}</output>
          <button type="button" class="mais" aria-label="Aumentar acompanhantes" (click)="alterar(1)" [disabled]="acompanhantes === max">+</button>
        </div>
      </div>

      <div class="ns-card linha">
        <label for="chegada">
          <strong>Previsão de chegada</strong>
          <small>Opcional</small>
        </label>
        <input id="chegada" type="time" formControlName="previsaoChegada" />
      </div>

      <label class="ns-card linha termos">
        <input type="checkbox" formControlName="aceiteTermos" />
        <span><strong>Li e aceito os termos da estadia</strong><small class="link">Ver termos</small></span>
      </label>

      <p class="ns-alerta ns-alerta--aviso">Sua chave digital chega no app em segundos depois do check-in.</p>

      @if (erro(); as mensagem) {
        <div class="ns-alerta ns-alerta--erro" role="alert">
          <span>{{ mensagem }}</span>
        </div>
      }

      <button class="ns-botao" type="submit" [disabled]="form.invalid || carregando()">
        {{ carregando() ? 'Enviando…' : 'Fazer check-in' }}
      </button>
    </form>
