name: nordstay

services:
  redis:
    build: ./redis
    image: nordstay/redis:8.2.2
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  kafka:
    build: ./kafka
    image: nordstay/kafka:4.3.1
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?defina KAFKA_CLUSTER_ID no .env}
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-init:
    build: ./kafka-init
    image: nordstay/kafka-init:4.3.1
    environment:
      PARTICOES_PADRAO: 6
      RETENCAO_DIAS: 7
      RETENCAO_DLT_DIAS: 14
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  minio:
    build: ./minio
    image: nordstay/minio:RELEASE.2025-10-15T17-29-55Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER no .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no .env}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # console web
    volumes:
      - minio-data:/data

  minio-init:
    build: ./minio-init
    image: nordstay/minio-init:RELEASE.2025-08-13T08-35-41Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER no .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no .env}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}
    depends_on:
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

    
volumes:
  redis-data:
  kafka-data:
  minio-data: